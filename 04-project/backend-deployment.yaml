apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: leshadocker/backend
        env:
        - name: DATABASE_URL
          value: postgresql://user:password@postgres:5432/clients
        ports:
        - containerPort: 8000
